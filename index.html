<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما عليا | عرض خاص</title>
    <!-- تحميل Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تحميل الخطوط العربية الأنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
    <!-- تحميل أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* التنسيقات الأساسية للصفحة */
        body {
            background-color: #0a0a0a;
            color: #eee;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* --- تأثيرات الفيلم السينمائي الكلاسيكي --- */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .scratch {
            position: fixed;
            top: 0; left: 10%; width: 2px; height: 100%;
            background: rgba(255, 255, 255, 0.2);
            animation: scratchAnim 0.6s infinite steps(1);
            z-index: 51;
            display: none;
        }

        @keyframes scratchAnim {
            0% { left: 10%; opacity: 0; }
            10% { opacity: 0.4; }
            20% { left: 80%; opacity: 0; }
            50% { left: 40%; opacity: 0.3; }
            100% { opacity: 0; }
        }

        /* --- التذكرة الذهبية --- */
        .ticket-wrapper {
            perspective: 1000px;
            z-index: 100;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.8s;
            padding: 0 16px;
        }

        .ticket {
            background: linear-gradient(135deg, #c5a059 0%, #f3dca6 50%, #c5a059 100%);
            width: 340px;
            max-width: 90vw;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(197, 160, 89, 0.3);
            position: relative;
            color: #3e2c00;
            cursor: pointer;
            text-align: center;
            border: 1px solid #ffeebb;
            transition: transform 0.3s;
        }

        .ticket:hover {
            transform: scale(1.05) rotate(2deg);
        }

        /* ثقوب التذكرة الجانبية */
        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            background-color: #0a0a0a;
            width: 30px; height: 30px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .ticket::before { left: -15px; }
        .ticket::after { right: -15px; }

        .dashed-divider {
            border-top: 2px dashed #3e2c00;
            margin: 20px 0;
            opacity: 0.4;
        }

        /* --- شاشة العرض السينمائي --- */
        .cinema-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
        }

        /* ضوء البروجيكتور المتحرك */
        .projector-beam {
            position: absolute;
            top: -20%; left: 50%; width: 60%; height: 120%;
            transform: translateX(-50%) perspective(400px) rotateX(20deg);
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            animation: flickerLight 0.15s infinite;
            z-index: 30;
        }

        @keyframes flickerLight {
            0% { opacity: 0.8; }
            50% { opacity: 0.6; }
            100% { opacity: 0.9; }
        }

        /* النصوص السينمائية المتجاوبة */
        .movie-text {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 900;
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.8s ease-out;
            position: absolute;
            width: 90%;
            max-width: 800px;
            line-height: 1.5;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .movie-text.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .movie-text.hide {
            opacity: 0;
            transform: scale(1.1) translateY(-20px);
            filter: blur(5px);
        }

        /* دائرة العد التنازلي قبل بدء الفيلم */
        .countdown-circle {
            width: 150px; height: 150px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 5rem;
            font-family: 'Amiri', serif;
            position: relative;
        }

        .countdown-line {
            position: absolute;
            top: 50%; left: 50%; width: 50%; height: 2px;
            background: white;
            transform-origin: left center;
            animation: clockHand 1s linear infinite;
        }
        @keyframes clockHand {
            from { transform: rotate(-90deg); }
            to { transform: rotate(270deg); }
        }

        /* التوقيع وزر إعادة العرض */
        .signature-footer {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-family: 'Amiri', serif;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 2s;
            text-align: center;
            z-index: 60;
        }

        .replay-btn {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
        }
        .replay-btn:hover {
            border-color: white;
            color: white;
        }
    </style>
</head>
<body>

    <!-- طبقة الضجيج والخدوش السينمائية -->
    <div class="film-grain"></div>
    <div class="scratch" id="scratch"></div>

    <!-- 1. واجهة التذكرة الذهبية -->
    <div class="ticket-wrapper" id="ticketScreen">
        <div class="ticket" onclick="startShow()">
            <div class="flex justify-between items-center opacity-70 mb-2">
                <span class="text-xs font-bold tracking-widest uppercase">Golden Ticket</span>
                <i class="fas fa-balance-scale"></i>
            </div>

            <h1 class="text-3xl font-black mb-1">عرض خاص جداً</h1>
            <h2 class="text-xl font-serif text-yellow-900 font-bold">لطالبة القانون المفضلة: عليا</h2>

            <div class="dashed-divider"></div>

            <div class="flex justify-between items-end px-2">
                <div class="text-right">
                    <p class="text-xs font-bold uppercase opacity-60">التاريخ</p>
                    <p class="text-sm font-bold">اليوم وكل يوم</p>
                </div>
                <div class="text-left">
                    <p class="text-xs font-bold uppercase opacity-60">المقعد</p>
                    <p class="text-sm font-bold">VIP - أحلى صديقة</p>
                </div>
            </div>

            <div class="mt-6 bg-yellow-900/10 py-3 rounded-lg border border-yellow-900/20">
                <p class="text-xs font-bold animate-pulse">اضغطي هنا لبدء العرض <i class="fas fa-play-circle mr-1"></i></p>
            </div>
        </div>
    </div>

    <!-- 2. واجهة شاشة السينما -->
    <div class="cinema-screen" id="cinemaScreen">
        <div class="projector-beam"></div>

        <!-- منطقة عرض المشاهد والنصوص -->
        <div id="contentArea" class="flex justify-center items-center w-full h-full relative z-50 px-4">
            <!-- يتم حقن المشاهد هنا بواسطة JavaScript -->
        </div>

        <!-- التوقيع النهائي -->
        <div class="signature-footer" id="footer">
            <p>من إعداد قيس جازي ❤️</p>
            <button class="replay-btn" onclick="location.reload()">إعادة العرض <i class="fas fa-undo mr-1"></i></button>
        </div>
    </div>

    <script>
        // سيناريو العرض الخاص بـ عليا
        const scenes = [
            { type: 'count', val: '3', time: 1000 },
            { type: 'count', val: '2', time: 1000 },
            { type: 'count', val: '1', time: 1000 },
            { type: 'text', val: 'عرض استثنائي..', time: 2200 },
            { type: 'text', val: 'لشخصية تملك القانون والقلب معاً..', time: 2800 },
            { type: 'text', val: 'عليا', style: 'font-family:"Amiri"; font-size: clamp(3.8rem, 13vw, 5.8rem); color:#d4af37;', time: 3000 },
            { type: 'text', val: 'طالبة القانون المفضلة عندي..', time: 2800 },
            { type: 'text', val: 'وأحلى صديقة بالدنيا كلها..', time: 2800 },
            { type: 'text', val: 'اللي دايماً بترتاح روحي بقربها..', time: 2800 },
            { type: 'text', val: 'وبذوب بحضنها من كتر الدفا والحنان.', time: 3500 },
            { type: 'text', val: '<div class="flex flex-col items-center justify-center gap-5"><div class="flex items-center justify-center gap-6"><i class="fas fa-balance-scale text-yellow-400 text-5xl"></i><i class="fas fa-heart text-red-500 text-6xl animate-pulse"></i></div><span class="text-2xl md:text-3xl font-serif text-white">حكمكِ على قلبي نهائي</span></div>', time: 3800 },
            { type: 'end', val: '', time: 0 }
        ];

        let currentStep = 0;
        const ticketScreen = document.getElementById('ticketScreen');
        const cinemaScreen = document.getElementById('cinemaScreen');
        const scratch = document.getElementById('scratch');
        const contentArea = document.getElementById('contentArea');
        const footer = document.getElementById('footer');

        /**
         * بدء العرض السينمائي وإخفاء التذكرة بحركة ثلاثية الأبعاد
         */
        function startShow() {
            try {
                ticketScreen.style.transform = "rotateX(70deg) translateY(-200px) scale(0.5)";
                ticketScreen.style.opacity = "0";

                setTimeout(() => {
                    ticketScreen.style.display = 'none';
                    cinemaScreen.style.display = 'flex';
                    scratch.style.display = 'block';
                    playNextScene();
                }, 800);
            } catch (error) {
                console.error("خطأ أثناء بدء العرض:", error);
            }
        }

        /**
         * تشغيل المشهد الحالي والانتقال تلقائياً للمشهد التالي
         */
        function playNextScene() {
            if (currentStep >= scenes.length) return;

            const scene = scenes[currentStep];
            contentArea.innerHTML = '';

            if (scene.type === 'end') {
                showEndCard();
                return;
            }

            const el = document.createElement('div');

            if (scene.type === 'count') {
                el.className = 'countdown-circle';
                el.innerHTML = `<span>${scene.val}</span><div class="countdown-line"></div>`;
            } else {
                el.className = 'movie-text';
                el.innerHTML = scene.val;
                if (scene.style) el.style.cssText = scene.style;
            }

            contentArea.appendChild(el);

            // إجبار المتصفح على إعادة الحساب لتفعيل حركة الظهور بسلاسة
            void el.offsetWidth;
            if (scene.type !== 'count') el.classList.add('show');

            // جدولة إخفاء المشهد والانتقال للتالي
            setTimeout(() => {
                if (scene.type !== 'count') {
                    el.classList.remove('show');
                    el.classList.add('hide');
                }

                setTimeout(() => {
                    currentStep++;
                    playNextScene();
                }, 500);

            }, scene.time);
        }

        /**
         * عرض شاشة النهاية مع التوقيع وزر الإعادة
         */
        function showEndCard() {
            contentArea.innerHTML = `
                <div class="text-center px-4">
                    <h1 class="text-3xl md:text-5xl font-serif text-white mb-3">أحلى صديقة وأغلى محامية</h1>
                    <p class="text-gray-400 text-base md:text-lg">دمتِ لي الأمان والدفا يا عليا ⚖️❤️</p>
                </div>
            `;
            footer.style.opacity = '1';
            scratch.style.display = 'none';
        }
    </script>
</body>
  </html>
